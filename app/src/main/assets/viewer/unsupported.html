<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formato desconocido</title>
<link rel="stylesheet" href="app.css">
<style>
  .card {
    margin: 32px 16px;
    padding: 20px;
    border-radius: 12px;
    background: var(--vw-card);
    box-shadow: 0 1px 4px var(--vw-shadow);
    color: var(--vw-ink);
  }
  .card h2 { margin: 0 0 8px; font-size: 18px; }
  .card .fname { font-weight: 600; word-break: break-all; }
  .card p { font-size: 14px; line-height: 1.5; }
  .as-text {
    display: block;
    width: 100%;
    margin: 18px 0 8px;
    padding: 12px 16px;
    border: 0;
    border-radius: 8px;
    background: var(--vw-accent);
    color: var(--vw-accent-ink);
    font: 500 15px Roboto, -apple-system, "Segoe UI", sans-serif;
  }
  .as-text:active { background: #8a2413; }
  .card .caveat { font-size: 13px; opacity: 0.75; }

  /* Nothing here is a document, it is all chrome, so all of it turns over. */
  @media (prefers-color-scheme: dark) {
    .card { background: #221F19; color: var(--vw-ink); box-shadow: 0 1px 4px var(--vw-shadow); }
    .as-text:active { background: #E09883; }
  }
</style>
</head>
<body>
<div class="card">
  <h2>Trini Office no reconoce este formato</h2>
  <p class="fname" id="fname"></p>
  <p id="hint"></p>
  <button type="button" class="as-text" id="asText" aria-describedby="caveat">Ver como texto</button>
  <p class="caveat" id="caveat">Si no es texto, verás caracteres sin sentido.</p>
</div>
<script src="app.js"></script>
<script>
document.getElementById("fname").textContent = vwName;
var hint = document.getElementById("hint");
if (vwExt === "doc" || vwExt === "ppt") {
  hint.textContent =
    "Es un formato antiguo de Office (." + vwExt + "). Si lo vuelves a guardar como ." +
    (vwExt === "doc" ? "docx" : "pptx") + ", Trini Office puede mostrarlo.";
} else {
  // Nothing useful to add; leave the card to the action below
  hint.style.display = "none";
}

document.getElementById("asText").addEventListener("click", function () {
  location.replace(
    "text.html?name=" + encodeURIComponent(vwName) + "&ext=" + encodeURIComponent(vwExt)
  );
});
</script>
</body>
</html>
