name: Build

on:
  push:
    branches: [main]
  pull_request:

# A second push to a branch supersedes the first; there is no reason to keep
# building the commit nobody is looking at any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The wrapper jar is a binary that runs before any of this repo's own
      # code does, and pull requests arrive from 31 forks. This checks it is
      # one Gradle published rather than one somebody edited.
      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Ahead of the builds: a compile error or a broken assertion should be
      # reported as such, not as a failure somewhere inside assembleRelease.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

      # Also builds the release merged manifest, which is the one that actually
      # ships, so checkReleasePermissions guards it too. Unsigned without a keystore.
      - name: Build release APK
        run: ./gradlew assembleRelease

      # Printed into the log so a tester handed the artifact link can confirm the
      # file they unzipped is the one this run produced, rather than taking it on
      # trust. GitHub rewraps artifacts in its own zip, so the hash is of the APK
      # inside, not of the download.
      - name: Checksum the debug APK
        run: shasum -a 256 app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: gander-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # Only on failure, and only the reports: the HTML test report says which
      # assertion went and with what, which a log tail does not.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gander-reports
          path: app/build/reports/
          retention-days: 7
